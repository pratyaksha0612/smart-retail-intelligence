services:
  # ----------------------------------------
  # BACKEND - Python FastAPI Web Service
  # ----------------------------------------
  - type: web
    name: smart-retail-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Persistent Disk for SQLite Database and Uploaded Files
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
      
    envVars:
      # Tell the app to use the persistent disk for the database
      - key: DATABASE_URL
        value: sqlite:///./uploads/sql_app.db
      - key: DB_PATH
        value: uploads/sql_app.db

  # ----------------------------------------
  # FRONTEND - React/Vite Static Site
  # ----------------------------------------
  - type: web
    name: smart-retail-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    
    # Map React Router to index.html for Single Page Applications
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Automatically pass the Backend URL to the Frontend
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-retail-backend
          envVarKey: RENDER_EXTERNAL_URL
