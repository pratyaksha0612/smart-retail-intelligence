services:
  # ----------------------------------------
  # BACKEND - Python FastAPI Web Service
  # ----------------------------------------
  - type: web
    name: smart-retail-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    
    envVars:
      # Set Python version to 3.10 for TensorFlow compatibility
      - key: PYTHON_VERSION
        value: 3.10.14
      # Use default paths since disk is not available on free tier
      - key: DATABASE_URL
        value: sqlite:///./sql_app.db
      - key: DB_PATH
        value: sql_app.db

  # ----------------------------------------
  # FRONTEND - React/Vite Static Site
  # ----------------------------------------
  - type: web
    name: smart-retail-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    
    # Map React Router to index.html for Single Page Applications
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Automatically pass the Backend URL to the Frontend
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-retail-backend
          envVarKey: RENDER_EXTERNAL_URL
